services:
  app:
    image: 214434260197.dkr.ecr.eu-west-1.amazonaws.com/portfolio:latest
  

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    

networks:
  web:


volumes:
  caddy_data:
  caddy_config:
