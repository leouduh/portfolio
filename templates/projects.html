{{define "content"}}
<h1 class="text-4xl font-bold mb-8">Projects</h1>
<div class="space-y-6">
    {{range .Projects}}
    <article class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800 dark:shadow-none">
        <div class="flex flex-wrap items-start justify-between gap-2">
            <h2 class="text-lg font-semibold">
                <a href="/projects/{{.Slug}}" class="hover:text-emerald-600 dark:hover:text-emerald-400">{{.Title}}</a>
            </h2>
            {{if .Featured}}
            <span class="whitespace-nowrap rounded-full bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400">Featured</span>
            {{end}}
        </div>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-400">{{.Summary}}</p>
        <div class="mt-3 flex flex-wrap gap-2">
            {{range .Stack}}
            <span class="rounded-full bg-emerald-50 px-3 py-1 text-xs font-medium text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400">{{.}}</span>
            {{end}}
        </div>
    </article>
    {{end}}
</div>
<p class="mt-8 pt-8 border-t border-gray-300 dark:border-gray-800 text-gray-700 dark:text-gray-400">
    See more on <a href="{{.Github.GithubUrl}}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 hover:underline">Github</a>.
</p>
{{end}}
