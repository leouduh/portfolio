{{define "content"}}
<h1 class="text-4xl font-bold mb-8">Experience</h1>
<div class="space-y-6">
    {{range .Experience}}
    <article class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800 dark:shadow-none">
    <div class="flex flex-wrap items-start justify-between gap-2">
            <div>
                <h2 class="text-lg font-semibold">{{.Role}}</h2>
                <p class="text-sm font-medium text-emerald-700 dark:text-gray-400">{{.Company}}</p>
                <span class="whitespace-nowrap rounded-full bg-emerald-900 px-3 py-1 text-xs font-medium text-emerald-50 dark:bg-gray-900">{{.Period}}</span>
                <div>
                    <ul class="mt-3 list-inside list-disc space-y-1 text-sm  text-emerald-900 dark:text-gray-700">
                        {{range .Highlights}}
                        <li class="text-emerald-900 dark:text-white">{{.}}</li>
                        {{end}}
                    </ul>
                </div>

            </div>

        </div>

    </article>
    {{end}}
</div>
<p class="mt-8 pt-8 border-t border-gray-300 dark:border-gray-800 text-gray-700 dark:text-gray-400">Want a PDF Version? <a href="{{.Contact.Email}}?subject=Resume%20Request" class="text-emerald-600 dark:text-emerald-300 hover:underline">Request it here!</a> </p>
{{end}}
